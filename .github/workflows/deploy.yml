name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject notes secret into notes-config.js
        env:
          NOTES_ENDPOINT: ${{ secrets.NOTES_ENDPOINT }}
          NOTES_SECRET: ${{ secrets.NOTES_SECRET }}
        run: |
          cat > assets/notes-config.js <<EOF
          // Auto-generated by .github/workflows/deploy.yml at deploy time.
          // Do not edit this file directly in the repo — edit the secrets
          // (Settings > Secrets and variables > Actions) instead. The
          // committed copy of this file should always have blank values;
          // this step overwrites it in the CI runner only, never in git.
          const NOTES_CONFIG = {
            endpoint: '${NOTES_ENDPOINT}',
            secret: '${NOTES_SECRET}'
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
